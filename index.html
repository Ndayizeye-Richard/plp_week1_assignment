<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple personal budget and expense tracker.">
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header" id="home">
    <h1>My Budget Tracker</h1>
    <p>Track your income and expenses in one place.</p>
  </header>

  <main class="container">
    <section class="expense-form-section" id="add-expense" aria-labelledby="add-expense-title">
      <h2 id="add-expense-title">Add Expense</h2>
      <p>Enter the details of a new expense below.</p>

      <form class="expense-form">
        <div class="form-group">
          <label for="expense-name">Expense name</label>
          <input type="text" id="expense-name" name="expense-name" placeholder="e.g. Groceries">
        </div>

        <div class="form-group">
          <label for="expense-amount">Amount (KES)</label>
          <input type="number" id="expense-amount" name="expense-amount" placeholder="e.g. 500" min="0" step="0.01">
        </div>

        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" name="expense-category">
            <option value="">Choose a category</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="education">Education</option>
            <option value="bills">Bills</option>
            <option value="other">Other</option>
          </select>
        </div>

        <button type="button" class="submit-button">Add Expense</button>
      </form>
    </section>

    <section class="expenses-section" id="your-expenses" aria-labelledby="your-expenses-title">
      <h2 id="your-expenses-title">Your Expenses</h2>
      <div class="empty-state">
        <p>No expenses yet.</p>
        <p class="helper-text">Your expenses will appear here in a future version.</p>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <p>Personal Budget &amp; Expense Tracker</p>
  </footer>
</body>
</html>
